<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapin — Coming Soon</title>
<meta name="description" content="Hapin bridges the gap between film discovery and the cinema experience. We'll make it happen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/hapin_logo_white_letters.svg" type="image/svg+xml">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-header__logo" aria-label="Hapin home">
    <img src="assets/hapin_logo_white.svg" alt="Hapin">
  </a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="nav-panel" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</header>

<nav id="nav-panel" class="nav-panel">
  <ul class="nav-panel__list">
    <li><a href="index.html" class="is-current">Home</a></li>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>
</nav>

<main>
  <div class="hero">
    <img class="hero__mark" src="assets/hapin_icon.svg" alt="" aria-hidden="true">
    <p class="hero__tagline">From a click to a seat,<br>we'll make it <span class="accent">Hapin</span>.</p>
    <p class="hero__status">Coming soon</p>
  </div>
</main>

<footer class="site-footer">
  &copy; 2026 Hapin, Inc. All rights reserved.
</footer>

<script>
  const toggle = document.querySelector('.menu-toggle');
  const panel = document.getElementById('nav-panel');
  toggle.addEventListener('click', () => {
    const isOpen = panel.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', isOpen);
    toggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panel.classList.contains('is-open')) {
      panel.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', false);
      toggle.setAttribute('aria-label', 'Open menu');
    }
  });
</script>

</body>
</html>
